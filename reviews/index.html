<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Gravity Shift</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tRVwsS2t/11zon-cropped.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --desc-color: #555555;
            --toggle-bg: #000000;
            --toggle-text: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --line-color: #000000;
            --form-input-bg: #ffffff;
            --form-border: #cccccc;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --desc-color: #a0aec0;
            --toggle-bg: #ffffff;
            --toggle-text: #000000;
            --nav-bg: rgba(18, 18, 18, 0.8);
            --line-color: #ffffff;
            --form-input-bg: #1e1e1e;
            --form-border: #444444;
        }

        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: 140px; 
            padding-bottom: 120px; 
            transition: background-color 0.3s, color 0.3s;
        }

        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px; z-index: 90;
            background-color: var(--nav-bg); backdrop-filter: blur(5px);
            transition: background-color 0.3s;
        }
        .nav-logo img {
            height: 40px;
            display: block;
        }
        .nav-links { 
            display: flex; 
            gap: 20px; 
            align-items: center; 
            margin-right: 140px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--text-color); text-decoration: none; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: opacity 0.3s;
            white-space: nowrap; 
        }
        .nav-links a:hover { opacity: 0.7; }
        
        .nav-links a.donate-btn {
            background-color: #008CFF;
            color: #ffffff !important;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .nav-links a.donate-btn:hover {
            background-color: #0074d9;
            opacity: 1; 
        }

        .theme-toggle-btn {
            position: fixed; top: 15px; right: 20px; z-index: 100;
            background-color: var(--toggle-bg); color: var(--toggle-text);
            border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.3s, color 0.3s;
        }

        @media (max-width: 768px) {
            body { padding-top: 190px; }
            nav {
                flex-direction: column; 
                align-items: center;
                padding: 15px 10px;
                gap: 15px;
            }
            .nav-links {
                margin-right: 0;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            .nav-links a { font-size: 0.8rem; padding: 5px 2px; }
            .theme-toggle-btn { position: static; margin-top: 5px; }
        }

        section { max-width: 600px; margin: 0 auto; padding: 20px; }

        .action-container {
            margin-bottom: 40px;
        }
        
        .button-wrapper {
            text-align: center;
        }

        .open-form-btn {
            background-color: #008CFF;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-family: 'Arial Black', Gadget, sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 140, 255, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .open-form-btn:hover {
            background-color: #0074d9;
            transform: translateY(-2px);
        }

        #form-wrapper {
            display: none;
            margin-top: 20px;
            margin-bottom: 40px;
            padding: 25px;
            border: 2px solid var(--line-color);
            border-radius: 8px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #review-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-family: Arial, sans-serif;
        }
        
        #review-form input, #review-form select, #review-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--form-border);
            border-radius: 6px;
            background-color: var(--form-input-bg);
            color: var(--text-color);
            font-size: 1rem;
        }
        
        #review-form textarea { height: 120px; resize: vertical; }
        
        #review-form button[type="submit"] {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: 2px solid var(--text-color);
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
        }

        .show-item {
            padding: 25px 0;
            border-top: 2px solid var(--line-color);
            font-family: Arial, sans-serif;
        }
        .show-item:last-of-type {
            border-bottom: 2px solid var(--line-color);
        }
        .show-main-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .show-date-time {
            font-family: 'Arial Black', Gadget, sans-serif;
            text-transform: uppercase;
        }
        .show-address {
            font-size: 1rem;
            color: var(--desc-color);
            letter-spacing: 0.5px;
        }

        #delete-review-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 8px 16px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        #delete-review-btn:hover {
            opacity: 0.9;
        }

        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #000000;
            border-top: 1px solid #222; padding: 15px 30px; display: flex;
            justify-content: space-between; align-items: center; z-index: 10;
        }
        .footer-text { color: #ffffff; font-size: 1rem; letter-spacing: 1px; }
        .social-links a { color: #ffffff; text-decoration: none; margin-left: 20px; font-size: 1.5rem; transition: opacity 0.3s; }
        .social-links a:hover { opacity: 0.7; }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" id="themeToggle">Dark Mode</button>

    <nav>
        <a href="/" class="nav-logo">
            <img src="https://i.postimg.cc/tRVwsS2t/11zon-cropped.png" alt="Gravity Shift Logo">
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="https://bbaitmusicstudios.mlswebstores.com/product-category/apparel/page/2/" target="_blank">Merch</a>
            <a href="/shows/">Shows</a>
            <a href="/meet/">Meet The Band</a>
            <a href="/contact/">Contact</a>
            <a href="/reviews/">Reviews</a>
            <a href="https://venmo.com/Gravity_Shift" target="_blank" class="donate-btn">Donate</a>
        </div>
    </nav>

    <section class="action-container" id="interaction-zone">
        <div class="button-wrapper">
            <button class="open-form-btn" id="toggleFormBtn">Send a Review</button>
        </div>
        
        <div id="form-wrapper">
            <form id="review-form">
                <input type="text" id="first-name" required placeholder="First Name">
                <input type="text" id="last-name" placeholder="Last Name (Optional)">
                <select id="rating-stars" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5 Stars)</option>
                    <option value="4">⭐⭐⭐⭐ (4 Stars)</option>
                    <option value="3">⭐⭐⭐ (3 Stars)</option>
                    <option value="2">⭐⭐ (2 Stars)</option>
                    <option value="1">⭐ (1 Star)</option>
                </select>
                <textarea id="comment-text" placeholder="Comment..."></textarea>
                <button type="submit">Submit Review</button>
            </form>
        </div>
    </section>

    <section>
        <h2 style="font-size: 2.5rem; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; text-align: center;">What Fans Are Saying</h2>
        <div id="reviews-display-list">Loading reviews...</div>
    </section>

    <footer>
        <div class="footer-text">Follow us!</div>
        <div class="social-links">
            <a href="https://www.instagram.com/gravity.shift.band/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/p/Gravity-Shift-Rock-Band-61572665002330/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = 'Light Mode';
        }
        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                toggleBtn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                toggleBtn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark'); 
            }
        });

        const toggleFormBtn = document.getElementById('toggleFormBtn');
        const formWrapper = document.getElementById('form-wrapper');
        
        if (toggleFormBtn) {
            toggleFormBtn.addEventListener('click', () => {
                if (formWrapper.style.display === 'block') {
                    formWrapper.style.display = 'none';
                    toggleFormBtn.textContent = 'Send a Review';
                } else {
                    formWrapper.style.display = 'block';
                    toggleFormBtn.textContent = 'Hide Form';
                }
            });
        }

        function renderUserStatus() {
            const savedReview = localStorage.getItem("user_submitted_review_data");
            const interactionZone = document.getElementById('interaction-zone');

            if (savedReview) {
                try {
                    const userReview = JSON.parse(savedReview);
                    const starString = '⭐'.repeat(parseInt(userReview.stars) || 5);
                    const lastName = userReview.last ? ` ${userReview.last}` : '';

                    interactionZone.innerHTML = `
                        <div style="text-align: left; font-family: Arial, sans-serif; padding: 25px; border: 3px solid #008CFF; border-radius: 8px; background-color: var(--form-input-bg);">
                            <div style="font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 0.8rem; color: #008CFF; letter-spacing: 1px; margin-bottom: 10px;">Your Live Review (Pending Site Update)</div>
                            <div class="show-main-info" style="margin-bottom: 8px;">
                                <span class="show-date-time" style="font-family: 'Arial Black', sans-serif;">${userReview.first}${lastName}</span>
                                <span style="font-size: 1.1rem;">${starString}</span>
                            </div>
                            <div class="show-address" style="color: var(--text-color); font-family: Arial, sans-serif; text-transform: none; font-weight: normal;">
                                "${userReview.comment || 'No comment left.'}"
                            </div>
                            <div style="text-align: right; margin-top: 15px;">
                                <button id="delete-review-btn">Delete & Write New Review</button>
                            </div>
                        </div>
                    `;

                    document.getElementById('delete-review-btn').addEventListener('click', () => {
                        localStorage.removeItem("user_submitted_review_data");
                        alert("Session cleared. You can now write a fresh review!");
                        location.reload();
                    });
                } catch (e) {
                    console.error("Local storage processing error:", e);
                }
            }
        }

        async function loadLiveReviews() {
            const displayList = document.getElementById('reviews-display-list');
            try {
                const response = await fetch('/reviews.json?t=' + new Date().getTime());
                const reviews = await response.json();

                if (!reviews || reviews.length === 0) {
                    displayList.innerHTML = "<p style='text-align:center; font-family:Arial; font-weight:normal;'>No public reviews posted yet.</p>";
                    return;
                }

                displayList.innerHTML = '';
                reviews.forEach(review => {
                    const reviewItem = document.createElement('div');
                    reviewItem.className = 'show-item';
                    
                    const starString = '⭐'.repeat(parseInt(review.stars) || 5);
                    const lastName = review.last ? ` ${review.last}` : '';

                    reviewItem.innerHTML = `
                        <div class="show-main-info" style="font-family: Arial, sans-serif;">
                            <span class="show-date-time" style="font-family: 'Arial Black', sans-serif;">${review.first}${lastName}</span>
                            <span style="font-size: 1.1rem;">${starString}</span>
                        </div>
                        <div class="show-address" style="color: var(--text-color); font-family: Arial, sans-serif; text-transform: none; font-weight: normal; margin-top: 5px;">
                            "${review.comment || 'No comment left.'}"
                        </div>
                    `;
                    displayList.appendChild(reviewItem);
                });
            } catch (err) {
                console.error("Error reading data file archive:", err);
                displayList.innerHTML = "<p style='text-align:center; font-family:Arial;'>Could not load the review archive.</p>";
            }
        }

        document.getElementById('review-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                first: document.getElementById('first-name').value,
                last: document.getElementById('last-name').value,
                stars: document.getElementById('rating-stars').value,
                comment: document.getElementById('comment-text').value
            };

            localStorage.setItem("user_submitted_review_data", JSON.stringify(payload));

            try {
                await fetch('https://formspree.io/f/xqerragj', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("Success! Your review was sent securely.");
                location.reload();
            } catch (err) {
                console.error("Formspree delivery network warning error:", err);
                alert("There was an issue dispatching the review.");
            }
        });

        renderUserStatus();
        loadLiveReviews();
    </script>
</body>
</html>
