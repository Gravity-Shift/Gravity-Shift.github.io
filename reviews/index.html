<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Gravity Shift</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/tRVwsS2t/11zon-cropped.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --desc-color: #555555;
            --toggle-bg: #000000;
            --toggle-text: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.8);
            --line-color: #000000;
            --form-input-bg: #ffffff;
            --form-border: #cccccc;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --desc-color: #a0aec0;
            --toggle-bg: #ffffff;
            --toggle-text: #000000;
            --nav-bg: rgba(18, 18, 18, 0.8);
            --line-color: #ffffff;
            --form-input-bg: #1e1e1e;
            --form-border: #444444;
        }

        body {
            font-family: 'Arial Black', Gadget, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-top: 140px;
            padding-bottom: 120px; 
            transition: background-color 0.3s, color 0.3s;
        }

        nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 30px; z-index: 90;
            background-color: var(--nav-bg); backdrop-filter: blur(5px);
            transition: background-color 0.3s;
        }
        .nav-logo img {
            height: 40px;
            display: block;
        }
        .nav-links { 
            display: flex; 
            gap: 20px; 
            align-items: center; 
            margin-right: 140px;
            flex-wrap: nowrap;
        }
        .nav-links a {
            color: var(--text-color); text-decoration: none; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: opacity 0.3s;
            white-space: nowrap; 
        }
        .nav-links a:hover { opacity: 0.7; }
        
        .nav-links a.donate-btn {
            background-color: #008CFF;
            color: #ffffff !important;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .nav-links a.donate-btn:hover {
            background-color: #0074d9;
            opacity: 1; 
        }

        .theme-toggle-btn {
            position: fixed; top: 15px; right: 20px; z-index: 100;
            background-color: var(--toggle-bg); color: var(--toggle-text);
            border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.3s, color 0.3s;
        }

        @media (max-width: 768px) {
            body { padding-top: 190px; }
            nav {
                flex-direction: column; 
                align-items: center;
                padding: 15px 10px;
                gap: 15px;
            }
            .nav-links {
                margin-right: 0;
                gap: 12px;
                flex-wrap: wrap;
                justify-content: center;
                width: 100%;
            }
            .nav-links a { font-size: 0.8rem; padding: 5px 2px; }
            .theme-toggle-btn { position: static; margin-top: 5px; }
        }

        section { max-width: 600px; margin: 0 auto; padding: 20px; }
        h3 { font-size: 2rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
        
        #review-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-family: Arial, sans-serif;
        }
        
        #review-form input, #review-form select, #review-form textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--form-border);
            border-radius: 6px;
            background-color: var(--form-input-bg);
            color: var(--text-color);
            font-size: 1rem;
            transition: border-color 0.3s, background-color 0.3s;
        }
        
        #review-form textarea { height: 120px; resize: vertical; }
        
        #review-form button[type="submit"] {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: 2px solid var(--text-color);
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s, color 0.2s;
        }
        #review-form button[type="submit"]:hover {
            opacity: 0.9;
        }

        .already-reviewed {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }
        .already-reviewed p { font-size: 1.2rem; margin-bottom: 20px; }
        #delete-review-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #000000;
            border-top: 1px solid #222; padding: 15px 30px; display: flex;
            justify-content: space-between; align-items: center; z-index: 10;
        }
        .footer-text { color: #ffffff; font-size: 1rem; letter-spacing: 1px; }
        .social-links a { color: #ffffff; text-decoration: none; margin-left: 20px; font-size: 1.5rem; transition: opacity 0.3s; }
        .social-links a:hover { opacity: 0.7; }
    </style>
</head>
<body>

    <button class="theme-toggle-btn" id="themeToggle">Dark Mode</button>

    <nav>
        <a href="/" class="nav-logo">
            <img src="https://i.postimg.cc/tRVwsS2t/11zon-cropped.png" alt="Gravity Shift Logo">
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="https://bbaitmusicstudios.mlswebstores.com/product-category/apparel/page/2/" target="_blank">Merch</a>
            <a href="/shows/">Shows</a>
            <a href="/meet/">Meet The Band</a>
            <a href="/contact/">Contact</a>
            <a href="/reviews/">Send a Review</a>
            <a href="https://venmo.com/Gravity_Shift" target="_blank" class="donate-btn">Donate</a>
        </div>
    </nav>

    <section>
        <div id="review-area">
            <form id="review-form">
                <h3>Leave a Review</h3>
                <input type="text" id="first-name" required placeholder="First Name">
                <input type="text" id="last-name" placeholder="Last Name (Optional)">
                <select id="rating-stars" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5 Stars)</option>
                    <option value="4">⭐⭐⭐⭐ (4 Stars)</option>
                    <option value="3">⭐⭐⭐ (3 Stars)</option>
                    <option value="2">⭐⭐ (2 Stars)</option>
                    <option value="1">⭐ (1 Star)</option>
                </select>
                <textarea id="comment-text" placeholder="Comment..."></textarea>
                <button type="submit">Submit Review</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-text">Follow us!</div>
        <div class="social-links">
            <a href="https://www.instagram.com/gravity.shift.band/" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.facebook.com/p/Gravity-Shift-Rock-Band-61572665002330/" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme');
        
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleBtn.textContent = 'Light Mode';
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                toggleBtn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                toggleBtn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark'); 
            }
        });

        function getCookie(name) {
            let value = "; " + document.cookie;
            let parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return null;
        }

        function checkExistingReview() {
            const hasReviewed = getCookie("has_submitted_review");
            const reviewArea = document.getElementById('review-area');

            if (hasReviewed) {
                reviewArea.innerHTML = `
                    <div class="already-reviewed">
                        <p>You have already submitted a global review!</p>
                        <button id="delete-review-btn">Delete My Review & Write a New One</button>
                    </div>
                `;

                document.getElementById('delete-review-btn').addEventListener('click', () => {
                    document.cookie = "has_submitted_review=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    alert("Your local session was cleared. You can now write a new review!");
                    location.reload();
                });
            }
        }

        document.getElementById('review-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                first: document.getElementById('first-name').value,
                last: document.getElementById('last-name').value,
                stars: document.getElementById('rating-stars').value,
                comment: document.getElementById('comment-text').value
            };

            document.cookie = "has_submitted_review=true; max-age=" + (60*60*24*365) + "; path=/;";

            try {
                await fetch('https://formspree.io/f/xqerragj', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                alert("Thank you for sending a review! It should go on the website in about a minute!");
                location.reload();
            } catch (err) {
                console.error("Error communicating with webhook:", err);
            }
        });

        checkExistingReview();
    </script>
</body>
</html>
