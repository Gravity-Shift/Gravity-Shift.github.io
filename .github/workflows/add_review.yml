name: Add Fan Review

on:
  repository_dispatch:
    types: [new-review-event]

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Process and Save Review
        run: |
          FIRST_NAME='${{ github.event.client_payload.first }}'
          LAST_NAME='${{ github.event.client_payload.last }}'
          STARS='${{ github.event.client_payload.stars }}'
          COMMENT='${{ github.event.client_payload.comment }}'
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NEW_ENTRY=$(jq -n \
            --arg f "$FIRST_NAME" \
            --arg l "$LAST_NAME" \
            --arg s "$STARS" \
            --arg c "$COMMENT" \
            --arg d "$DATE" \
            '{first: $f, last: $l, stars: ($s|tonumber), comment: $c, date: $d}')

          # Fixed: Puts the new entry at the very beginning of the array safely
          jq "[ \$NEW_ENTRY ] + ." reviews.json > temp.json && mv temp.json reviews.json

      - name: Commit and Push to GitHub Pages
        run: |
          git config --global user.name "GravityShiftBot"
          git config --global user.email "bot@gravityshiftband.org"
          git add reviews.json
          git commit -m "system: global review added by ${{ github.event.client_payload.first }}"
          git push
